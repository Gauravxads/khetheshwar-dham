<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shree Khetheshwar Dham</title>
<meta name="description" content="Join the Samaj and follow Shree Khetheshwar Dham on Instagram and Facebook.">
<meta name="theme-color" content="#7a1f1f">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% 0%,#ffb347 0%,#e8762b 35%,#7a1f1f 100%);
    color:#fff;padding:24px;
  }
  .card{width:100%;max-width:400px;text-align:center}
  .om{font-size:56px;line-height:1;margin-bottom:12px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
  h1{font-size:26px;font-weight:700;letter-spacing:.3px}
  p.sub{opacity:.9;margin:8px 0 28px;font-size:15px}
  a.btn{
    display:flex;align-items:center;gap:14px;
    background:#fff;color:#3a1010;text-decoration:none;
    padding:16px 18px;border-radius:16px;margin-bottom:14px;
    font-size:17px;font-weight:600;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    transition:transform .15s ease;
  }
  a.btn:active{transform:scale(.97)}
  a.btn .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
  a.btn .ic svg{width:24px;height:24px;fill:#fff}
  a.btn .txt{flex:1;text-align:left}
  a.btn .txt small{display:block;font-weight:400;font-size:13px;color:#7a5a5a;margin-top:2px}
  a.btn .arr{font-size:22px;color:#c08a6a}
  .form .ic{background:#e8762b}
  .ig .ic{background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)}
  .fb .ic{background:#1877f2}
  a.form{border:2px solid #ffd27a}
  footer{margin-top:22px;font-size:12px;opacity:.75}
</style>
</head>
<body>
<main class="card">
  <div class="om">🕉️</div>
  <h1>Shree Khetheshwar Dham</h1>
  <p class="sub">Choose where you'd like to go</p>

  <a class="btn form" href="https://samaj-join.vercel.app/">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 13h8v2H8v-2zm0 4h5v2H8v-2z"/></svg></span>
    <span class="txt">Join the Samaj<small>Fill the registration form</small></span>
    <span class="arr">›</span>
  </a>

  <a class="btn ig" href="https://www.instagram.com/shreekhetheshwardham/">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM21.9 7.1c-.1-1.6-.4-3-1.6-4.2S17.6 1.4 16 1.3C14.3 1.2 9.7 1.2 8 1.3c-1.6.1-3 .4-4.2 1.6S2.2 5.5 2.1 7.1C2 8.8 2 13.2 2.1 14.9c.1 1.6.4 3 1.6 4.2s2.6 1.5 4.2 1.6c1.7.1 6.3.1 8 0 1.6-.1 3-.4 4.2-1.6s1.5-2.6 1.6-4.2c.1-1.7.1-6.1.2-7.8zM19.8 18c-.4.9-1 1.5-1.9 1.9-1.3.5-4.4.4-5.9.4s-4.6.1-5.9-.4c-.9-.4-1.5-1-1.9-1.9-.5-1.3-.4-4.4-.4-5.9s-.1-4.6.4-5.9c.4-.9 1-1.5 1.9-1.9C7.4 3.8 10.5 3.9 12 3.9s4.6-.1 5.9.4c.9.4 1.5 1 1.9 1.9.5 1.3.4 4.4.4 5.9s.1 4.6-.4 5.9z"/></svg></span>
    <span class="txt">Instagram<small>@shreekhetheshwardham</small></span>
    <span class="arr">›</span>
  </a>

  <a class="btn fb" href="https://www.facebook.com/people/Shree-Khetheshwar-Dham/pfbid09ZTzugHdEquLocwDnZmAedzvwR35jxLfAMYTz6MLgzqTHTPcghqTuV77MSm1rm7ol/">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg></span>
    <span class="txt">Facebook<small>Shree Khetheshwar Dham</small></span>
    <span class="arr">›</span>
  </a>

  <footer>Jai Shree Khetheshwar</footer>
</main>
</body>
</html>
